name: Daily Market Scan

on:
  schedule:
    # 10:30 America/New_York. GitHub cron is UTC, so both DST slots are listed.
    - cron: "30 14 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip outside NYSE schedule
        id: market
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import pandas_market_calendars as mcal

          now = datetime.now(ZoneInfo("America/New_York"))
          calendar = mcal.get_calendar("NYSE")
          schedule = calendar.schedule(start_date=now.date(), end_date=now.date())
          schedule_cron = os.environ.get("SCHEDULE_CRON", "")
          manual_run = not schedule_cron
          is_dst = bool(now.dst())
          expected_cron = "30 14 * * 1-5" if is_dst else "30 15 * * 1-5"
          should_run = bool(not schedule.empty and (manual_run or schedule_cron == expected_cron))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
          print(f"New York time: {now.isoformat()}, cron: {schedule_cron or 'manual'}, expected: {expected_cron}, NYSE open: {not schedule.empty}, run: {should_run}")
          PY

      - name: Run all scanners
        if: steps.market.outputs.should_run == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: python scripts/run_all_scanners.py --top 50 --report-dir reports/ci --email

      - name: Publish dated report
        if: steps.market.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ci
          git diff --cached --quiet || git commit -m "Add daily scanner report $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
